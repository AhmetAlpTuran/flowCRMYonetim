<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Flow CRM Ödeme</title>
<!--
  Payment page for Flow CRM subscriptions (docs/BILLING.md). The app opens
  ?oturum=<checkout id>; this page loads that checkout's iyzico form from the
  iyzico-gateway Edge Function and shows it. iyzico then returns the customer to the
  gateway, which confirms the payment and redirects to sonuc/.
  BEFORE PUBLISHING: set flow-functions-url to the project's functions URL.
-->
<meta name="flow-functions-url" content="https://YOUR-PROJECT-REF.supabase.co/functions/v1">
<meta name="theme-color" content="#0E1116">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<!-- Styles: ../assets/flow.css ("Gece mesaisi", self-hosted fonts; .pay, .card, .error). -->
<link rel="stylesheet" href="../assets/flow.css">
<script src="../assets/theme.js"></script>
</head>
<body>
<header class="site-header">
  <span class="logo" role="img" aria-label="Flow CRM">
    <img class="logo-mark" src="../assets/flow-mark.png" width="30" height="30" alt="">
    <span class="logo-word" aria-hidden="true">flow</span>
    <span class="logo-badge" aria-hidden="true">CRM</span>
  </span>
  <div class="header-actions">
    <button type="button" class="icon-btn theme-toggle js-only" data-theme-toggle data-label-light="Açık görünüme geç" data-label-dark="Koyu görünüme geç" aria-label="Açık görünüme geç" title="Açık görünüme geç">
      <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<main class="pay">
  <p class="eyebrow">GÜVENLİ ÖDEME</p>
  <h1>Flow CRM aboneliği</h1>
  <p class="muted" id="summary">Ödeme formu yükleniyor…</p>
  <div class="card" id="message" hidden></div>
  <div id="iyzipay-checkout-form" class="responsive"></div>
  <div class="note">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    <p class="muted">Kart bilgileriniz Flow CRM'e iletilmez; ödeme iyzico güvenli ödeme formunda alınır.</p>
  </div>
</main>
<script>
(function () {
  "use strict";
  var functionsUrl = document.querySelector('meta[name="flow-functions-url"]').content.replace(/\/+$/, "");
  var summary = document.getElementById("summary");
  var message = document.getElementById("message");
  function show(text, isError) {
    summary.hidden = true;
    message.hidden = false;
    message.textContent = text;
    message.className = "card" + (isError ? " error" : "");
  }
  var id = new URLSearchParams(location.search).get("oturum") || "";
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) {
    show("Ödeme bağlantısı geçersiz. Uygulamadaki Abonelik ekranından yeniden başlatın.", true);
    return;
  }
  if (functionsUrl.indexOf("YOUR-PROJECT-REF") !== -1) {
    show("Ödeme sayfası henüz yapılandırılmadı.", true);
    return;
  }
  fetch(functionsUrl + "/iyzico-gateway/checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ checkout_id: id })
  }).then(function (response) {
    if (!response.ok) throw new Error("unavailable");
    return response.json();
  }).then(function (data) {
    if (data.status === "completed") {
      show("Bu ödeme tamamlandı. Uygulamaya dönebilirsiniz.", false);
      return;
    }
    if (data.status !== "ready" || typeof data.content !== "string") {
      show("Ödeme oturumunun süresi doldu. Uygulamadaki Abonelik ekranından yeniden başlatın.", true);
      return;
    }
    var period = data.billing_period === "yearly" ? "yıllık" : "aylık";
    summary.textContent = (data.plan_name || "Plan") + " (" + period + ") için ödeme";
    // The iyzico form arrives as HTML with scripts; scripts inserted through innerHTML
    // do not run, so recreate each one.
    var holder = document.createElement("div");
    holder.innerHTML = data.content;
    Array.prototype.forEach.call(holder.querySelectorAll("script"), function (old) {
      var script = document.createElement("script");
      Array.prototype.forEach.call(old.attributes, function (a) { script.setAttribute(a.name, a.value); });
      script.text = old.text;
      document.body.appendChild(script);
    });
  }).catch(function () {
    show("Ödeme formu yüklenemedi. Bağlantınızı kontrol edip sayfayı yenileyin.", true);
  });
})();
</script>
</body>
</html>
