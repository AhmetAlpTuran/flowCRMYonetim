<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flow CRM Ödeme Sonucu</title>
<meta name="theme-color" content="#0E1116">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/favicon-32.png" sizes="32x32" type="image/png">
<!-- Styles: ../../assets/flow.css ("Gece mesaisi", self-hosted fonts; .pay, .card, .ok, .error). -->
<link rel="stylesheet" href="../../assets/flow.css">
<script src="../../assets/theme.js"></script>
</head>
<body>
<header class="site-header">
  <span class="logo" role="img" aria-label="Flow CRM">
    <svg class="logo-mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" focusable="false"><circle class="ring-outer" cx="15" cy="15" r="13.5"/><circle class="ring-inner" cx="15" cy="15" r="8.5"/><circle class="core" cx="15" cy="15" r="4"/></svg>
    <span class="logo-word" aria-hidden="true">flow</span>
    <span class="logo-badge" aria-hidden="true">CRM</span>
  </span>
  <div class="header-actions">
    <button type="button" class="icon-btn theme-toggle js-only" data-theme-toggle data-label-light="Açık görünüme geç" data-label-dark="Koyu görünüme geç" aria-label="Açık görünüme geç" title="Açık görünüme geç">
      <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<main class="pay">
  <svg class="pay-rings" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="19"/><circle class="core" cx="32" cy="32" r="7"/></svg>
  <p class="eyebrow">ÖDEME SONUCU</p>
  <h1 id="title">Ödeme durumu</h1>
  <div class="card"><p id="text">Ödeme durumu kontrol ediliyor…</p></div>
  <p class="muted">Bu sekmeyi kapatıp Flow CRM uygulamasına dönebilirsiniz.</p>
</main>
<script>
(function () {
  "use strict";
  var outcomes = {
    basarili: ["Ödeme tamamlandı", "Aboneliğiniz etkinleşti. Uygulamada Abonelik ekranı birkaç saniye içinde güncellenir.", "ok"],
    basarisiz: ["Ödeme tamamlanamadı", "Kartınızdan ücret alınmadı veya ödeme reddedildi. Uygulamadaki Abonelik ekranından yeniden deneyebilirsiniz.", "error"],
    beklemede: ["Ödeme doğrulanıyor", "Ödemenizin sonucu henüz doğrulanamadı. Uygulamada Abonelik ekranını açtığınızda yeniden kontrol edilir; tekrar ödeme yapmayın.", ""]
  };
  var outcome = outcomes[new URLSearchParams(location.search).get("durum")] || outcomes.beklemede;
  document.getElementById("title").textContent = outcome[0];
  var text = document.getElementById("text");
  text.textContent = outcome[1];
  text.className = outcome[2];
})();
</script>
</body>
</html>
