name: wpapp
description: Flow CRM - WhatsApp customer service, AI assistant and campaigns for businesses.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.5
  supabase_flutter: ^2.6.1
  http: ^1.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-Regular.ttf
          weight: 400
        - asset: assets/fonts/Bricolage-Medium.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-Bold.ttf
          weight: 700
    - family: BricolageDisplay
      fonts:
        - asset: assets/fonts/BricolageDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageDisplay-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
