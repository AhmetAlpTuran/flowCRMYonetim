name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --timeout 60s

  edge-functions:
    name: Edge Functions type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          # Pinned so a new Deno/TypeScript release cannot break CI unannounced;
          # bump deliberately together with the local Docker image in CLAUDE.md.
          deno-version: v2.9.8
      - name: Type check every function and test
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*_test.ts
      - name: Unit tests
        run: deno test --allow-env --allow-net=127.0.0.1 supabase/functions/_shared

  database:
    name: Migrations and SQL fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version the stack is verified with locally; upgrade deliberately.
          version: 2.20.8
      - name: Start database and apply all migrations from scratch
        # Auth (gotrue) stays up because the fixtures rely on its auth schema. One retry
        # absorbs transient image-pull or health-check failures; the cause is published
        # as an annotation, which is readable without signing in to GitHub.
        run: |
          for attempt in 1 2; do
            if supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor 2>&1 | tee start.log; then
              grep -q "Started supabase" start.log && exit 0
            fi
            echo "::warning title=supabase start failed (attempt $attempt)::$(grep -iE 'error|failed|unhealthy' start.log | tail -3 | tr '\n' ' ' | cut -c1-900)"
            supabase stop --no-backup || true
          done
          exit 1
      - name: Run SQL fixtures
        run: bash scripts/run_sql_tests.sh
