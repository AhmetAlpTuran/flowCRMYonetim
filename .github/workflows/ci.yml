name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --timeout 60s

  edge-functions:
    name: Edge Functions type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check every function
        run: deno check supabase/functions/*/index.ts
      - name: Unit tests
        run: deno test --allow-env --allow-net=127.0.0.1 supabase/functions/_shared

  database:
    name: Migrations and SQL fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database and apply all migrations from scratch
        run: supabase db start
      - name: Run SQL fixtures
        run: scripts/run_sql_tests.sh
